name: Realtime statistics collection

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realtime-statistics-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect statistics
        env:
          COLLECTOR_SECRET: ${{ secrets.REALTIME_COLLECTOR_SECRET }}
        run: |
          if [ -z "$COLLECTOR_SECRET" ]; then
            echo "::error::REALTIME_COLLECTOR_SECRET is not configured"
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 5 --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $COLLECTOR_SECRET" \
            "https://moyastudia.vercel.app/api/internal/realtime-collect"
