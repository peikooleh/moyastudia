name: Scheduled YouTube catalog refresh

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refresh cached YouTube content
        env:
          COLLECTOR_SECRET: ${{ secrets.REALTIME_COLLECTOR_SECRET }}
        run: |
          if [ -z "$COLLECTOR_SECRET" ]; then
            echo "::error::REALTIME_COLLECTOR_SECRET is not configured"
            exit 1
          fi

          for round in $(seq 1 100); do
            echo "Catalog refresh round $round"
            response="$(curl --fail-with-body --show-error --silent \
              --retry 2 --retry-delay 5 --max-time 240 \
              --request POST \
              --header "Authorization: Bearer $COLLECTOR_SECRET" \
              "https://moyastudia.vercel.app/api/internal/catalog-refresh")"
            echo "$response"
            pending="$(printf '%s' "$response" | python -c 'import json,sys; print(int(json.load(sys.stdin).get("pending", 0)))')"
            if [ "$pending" -eq 0 ]; then
              echo "Catalog refresh complete"
              exit 0
            fi
          done

          echo "::error::Catalog refresh did not finish within 100 bounded rounds"
          exit 1
